[package]
name = "insurcraft-engine"
description = "InsurCraft engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
insurcraft-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
insurcraft-render = { workspace = true }
insurcraft-cos = { workspace = true }
insurcraft-organize = { workspace = true }
insurcraft-annot = { workspace = true }
insurcraft-forms = { workspace = true }
insurcraft-xfa = { workspace = true }
insurcraft-edit = { workspace = true }
insurcraft-redact = { workspace = true }
insurcraft-print = { workspace = true }
insurcraft-xfdf = { workspace = true }
insurcraft-sign = { workspace = true }
insurcraft-optimize = { workspace = true }
insurcraft-a11y = { workspace = true }
insurcraft-ocr = { workspace = true }
insurcraft-js = { workspace = true }
insurcraft-compare = { workspace = true }
insurcraft-preflight = { workspace = true }
insurcraft-export = { workspace = true }
insurcraft-fonts = { workspace = true }
insurcraft-create = { workspace = true }
insurcraft-model = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today").
chrono = { version = "0.4", default-features = false, features = ["clock"] }
